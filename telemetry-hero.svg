<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Subtle Circuit Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="30" cy="0" r="1" fill="#334155" opacity="0.6" />
    </pattern>

    <!-- SVG Filters for Neon Bloom -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseTrace {
      0% { stroke-dashoffset: 100; opacity: 0.3; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }

    @keyframes liveWave {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -240; }
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes blinkBeacon {
      0%, 100% { opacity: 0.3; r: 3; }
      50% { opacity: 1; r: 5; }
    }

    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { transform: translateY(180px); opacity: 0.15; }
    }

    .circuit-wire {
      stroke: #334155;
      stroke-width: 1.5;
      fill: none;
    }

    .pulse-bus {
      stroke: #00f2fe;
      stroke-width: 2;
      stroke-dasharray: 20, 80;
      fill: none;
      filter: url(#neonGlow);
      animation: pulseTrace 2.5s linear infinite;
    }

    .pulse-data {
      stroke: #10b981;
      stroke-width: 2;
      stroke-dasharray: 15, 60;
      fill: none;
      filter: url(#neonGlow);
      animation: pulseTrace 2s linear infinite reverse;
    }

    .oscilloscope-wave {
      stroke: #00f2fe;
      stroke-width: 2;
      stroke-dasharray: 240;
      fill: none;
      filter: url(#neonGlow);
      animation: liveWave 3s linear infinite;
    }

    .beacon {
      fill: #10b981;
      filter: url(#neonGlow);
      animation: blinkBeacon 2s ease-in-out infinite;
    }

    .radar-beam {
      transform-origin: 770px 150px;
      animation: radarSpin 4s linear infinite;
    }

    .mono-text {
      font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Canvas Container with Rounded Border -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  <rect width="900" height="320" rx="16" fill="url(#grid)" />

  <!-- Top Glass Terminal Bar -->
  <rect x="0" y="0" width="900" height="42" rx="16" fill="#0f172a" fill-opacity="0.8" />
  <path d="M 0 42 L 900 42" stroke="#1e293b" stroke-width="1" />
  
  <!-- Window Controls -->
  <circle cx="25" cy="21" r="5" fill="#ef4444" />
  <circle cx="42" cy="21" r="5" fill="#f59e0b" />
  <circle cx="59" cy="21" r="5" fill="#10b981" />

  <!-- Title / Terminal Tab -->
  <text x="85" y="25" fill="#94a3b8" class="mono-text" font-weight="600" font-size="12">
    aditya@omarchy: ~/workbench/hardware_ai_node.sys
  </text>

  <!-- Live Status Badge on Top Right -->
  <g transform="translate(730, 13)">
    <rect width="145" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <circle cx="15" cy="10" r="4" class="beacon" />
    <text x="26" y="14" fill="#38bdf8" class="mono-text" font-size="10" font-weight="700">STATUS: ONLINE</text>
  </g>

  <!-- ========================================================
       LEFT SECTOR: INTERCONNECTED HARDWARE NODES & SIGNAL BUS
       ======================================================== -->

  <!-- Node 1: Linux / Kernel Node -->
  <g transform="translate(45, 75)">
    <rect width="180" height="52" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.2" filter="url(#softGlow)" />
    <text x="14" y="24" fill="#38bdf8" class="mono-text" font-size="11" font-weight="700">HOST // ARCH LINUX</text>
    <text x="14" y="40" fill="#64748b" class="mono-text" font-size="9.5">HYPRLAND • WAYLAND • POSIX</text>
  </g>

  <!-- Node 2: MCU (ESP32) Core -->
  <g transform="translate(130, 175)">
    <rect width="190" height="58" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.2" filter="url(#softGlow)" />
    <text x="14" y="24" fill="#10b981" class="mono-text" font-size="11" font-weight="700">MCU // ESP32 DevKit V1</text>
    <text x="14" y="42" fill="#64748b" class="mono-text" font-size="9.5">BLE HID • I2C BUS • DUAL-CORE</text>
  </g>

  <!-- Node 3: Sensor Array (MPU-6050) -->
  <g transform="translate(45, 240)">
    <rect width="170" height="48" rx="8" fill="#111827" stroke="#ec4899" stroke-width="1.2" filter="url(#softGlow)" />
    <text x="14" y="22" fill="#ec4899" class="mono-text" font-size="11" font-weight="700">IMU // MPU-6050</text>
    <text x="14" y="38" fill="#64748b" class="mono-text" font-size="9.5">6-AXIS GYRO &amp; ACCEL</text>
  </g>

  <!-- Hardware Circuit Routing Wires -->
  <path d="M 135 127 L 135 150 L 225 150 L 225 175" class="circuit-wire" />
  <path d="M 135 127 L 135 150 L 225 150 L 225 175" class="pulse-bus" />

  <path d="M 130 240 L 130 205 L 170 205 L 170 233" class="circuit-wire" />
  <path d="M 130 240 L 130 205 L 170 205 L 170 233" class="pulse-data" />

  <!-- Outbound Data Bus to Processor Screen -->
  <path d="M 320 205 L 430 205" class="circuit-wire" />
  <path d="M 320 205 L 430 205" class="pulse-bus" />
  <circle cx="375" cy="205" r="3" fill="#00f2fe" filter="url(#neonGlow)" />
  <text x="335" y="195" fill="#64748b" class="mono-text" font-size="8.5">400 kHz I2C</text>

  <!-- Central Bridge Indicator -->
  <g transform="translate(390, 95)">
    <rect width="90" height="70" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="10" y="22" fill="#94a3b8" class="mono-text" font-size="9" font-weight="700">PIPELINE</text>
    <text x="10" y="38" fill="#38bdf8" class="mono-text" font-size="8.5">DATA FUSION</text>
    <text x="10" y="52" fill="#10b981" class="mono-text" font-size="8.5">LOW JITTER</text>
  </g>

  <!-- ========================================================
       RIGHT SECTOR: LIVE OSCILLOSCOPE & TELEMETRY MONITOR
       ======================================================== -->

  <!-- Oscilloscope Display Frame -->
  <g transform="translate(510, 65)">
    <rect width="355" height="175" rx="10" fill="#050811" stroke="#334155" stroke-width="1.2" />
    
    <!-- Oscilloscope Grid Reticle -->
    <line x1="0" y1="87" x2="355" y2="87" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="177" y1="0" x2="177" y2="175" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4" />
    <circle cx="177" cy="87" r="60" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,6" />

    <!-- Waveform 1: Real-time Sine Oscillations -->
    <path d="M 15 87 Q 45 35, 75 87 T 135 87 T 195 87 T 255 87 T 315 87 T 345 87" class="oscilloscope-wave" />

    <!-- Secondary Waveform: Damped Response -->
    <path d="M 15 87 Q 35 60, 55 87 T 95 87 T 135 87 T 175 87 T 215 87 T 255 87 T 295 87 T 340 87" 
          fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.4" stroke-dasharray="160" />

    <!-- Radar Sweep in Corner -->
    <g transform="translate(0, 0)">
      <circle cx="310" cy="40" r="24" fill="none" stroke="#1e293b" stroke-width="1" />
      <circle cx="310" cy="40" r="14" fill="none" stroke="#334155" stroke-width="0.8" />
      <line x1="310" y1="40" x2="334" y2="40" stroke="#00f2fe" stroke-width="1.5" class="radar-beam" />
    </g>

    <!-- Monitor Telemetry HUD Overlay -->
    <text x="18" y="25" fill="#38bdf8" class="mono-text" font-size="10" font-weight="700">OSCILLOSCOPE // REALTIME BLE FEED</text>
    <text x="18" y="42" fill="#64748b" class="mono-text" font-size="9">CH1: GYRO_Z (EMA SMOOTHED)  |  CH2: ACCEL_MAG</text>

    <!-- Bottom Readouts -->
    <text x="18" y="155" fill="#10b981" class="mono-text" font-size="10">SAMPLE: 100 Hz</text>
    <text x="145" y="155" fill="#f59e0b" class="mono-text" font-size="10">DRIFT: 0.02 deg/s</text>
    <text x="270" y="155" fill="#38bdf8" class="mono-text" font-size="10">LATENCY: 4ms</text>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(45, 275)">
    <text x="0" y="24" fill="#38bdf8" class="mono-text" font-weight="700" font-size="12">❯ ADITYA</text>
    <text x="80" y="24" fill="#94a3b8" class="mono-text" font-size="11">| CS &amp; Data Science • Embedded Prototyping • Modern Systems • Agentic AI</text>
  </g>
</svg>
