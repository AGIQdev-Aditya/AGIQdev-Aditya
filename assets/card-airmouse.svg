<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 218" width="100%" height="100%">
  <style>
    @keyframes busFlow {
      from { stroke-dashoffset: 30; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes blePulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.2; }
    }
    .i2c-line { stroke-dasharray: 5 3; animation: busFlow 1.6s linear infinite; }
    .ble-wave { animation: blePulse 2s ease-in-out infinite; }
  </style>
  <rect x="1" y="1" width="458" height="216" rx="10" fill="#0b0b0e" stroke="#27272a" stroke-width="1"/>
  <path d="M 12 12 L 20 12 M 12 12 L 12 20" stroke="#52525b" stroke-width="1"/>

  <text x="26" y="30" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5" letter-spacing="1.2">02 // EMBEDDED HARDWARE</text>
  <rect x="284" y="15" width="154" height="22" rx="4" fill="#111115" stroke="#27272a" stroke-width="1"/>
  <text x="361" y="29" fill="#38bdf8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="middle">C++ · Arduino · BLE</text>

  <text x="26" y="64" fill="#fafafa" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">esp32-air-mouse</text>
  <text x="26" y="86" fill="#a1a1aa" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Wireless BLE air mouse built with ESP32, MPU-6050 &amp; AI docs.</text>

  <line x1="26" y1="103" x2="434" y2="103" stroke="#1e1e24" stroke-width="1"/>

  <!-- Embedded Hardware Schematic -->
  <rect x="26" y="116" width="408" height="84" rx="6" fill="#060608" stroke="#1c1c22" stroke-width="1"/>

  <!-- MPU-6050 Block -->
  <rect x="40" y="128" width="90" height="36" rx="4" fill="#111115" stroke="#27272a"/>
  <text x="85" y="143" fill="#e4e4e7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">MPU-6050</text>
  <text x="85" y="156" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">6-Axis Gyro</text>

  <!-- I2C Bus -->
  <line x1="132" y1="146" x2="196" y2="146" stroke="#f59e0b" stroke-width="1.5" class="i2c-line"/>
  <text x="164" y="139" fill="#f59e0b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">SDA21/SCL22</text>

  <!-- ESP32 Block -->
  <rect x="198" y="128" width="98" height="36" rx="4" fill="#111115" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="247" y="143" fill="#fafafa" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">ESP32 V1</text>
  <text x="247" y="156" fill="#38bdf8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">BleMouse HID</text>

  <!-- BLE Radio Waves -->
  <path d="M 304 140 A 8 8 0 0 1 304 152" fill="none" stroke="#38bdf8" stroke-width="1.4" class="ble-wave"/>
  <path d="M 310 136 A 14 14 0 0 1 310 156" fill="none" stroke="#38bdf8" stroke-width="1.4" class="ble-wave"/>
  <text x="326" y="149" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="9">BLE</text>

  <!-- Host Block -->
  <rect x="352" y="128" width="68" height="36" rx="4" fill="#111115" stroke="#27272a"/>
  <text x="386" y="143" fill="#10b981" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" text-anchor="middle">Linux PC</text>
  <text x="386" y="156" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="8.5" text-anchor="middle">Cursor</text>

  <!-- Verified Firmware Constants -->
  <text x="40" y="186" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5">DEADZONE: 2.0   <tspan fill="#3f3f46">│</tspan>   SENS: 0.35   <tspan fill="#3f3f46">│</tspan>   CAL BTN: GPIO 15</text>
</svg>