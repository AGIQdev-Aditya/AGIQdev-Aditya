<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="100%" height="100%">
  <defs>
    <pattern id="microDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="0.65" fill="#27272a" />
    </pattern>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="scanSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="scopeClip">
      <rect x="554" y="76" width="364" height="100" rx="4"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulseLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    @keyframes flowDash {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes scanMove {
      0% { transform: translateX(-60px); }
      100% { transform: translateX(370px); }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .led-live { animation: pulseLed 2.2s ease-in-out infinite; }
    .trace-flow { stroke-dasharray: 8 4; animation: flowDash 2.8s linear infinite; }
    .scope-sweep { animation: scanMove 4.5s linear infinite; }
    .term-cursor { animation: cursorBlink 1.1s steps(1) infinite; }
  </style>

  <!-- Base Obsidian Canvas -->
  <rect x="1" y="1" width="958" height="324" rx="10" fill="#09090b" stroke="#27272a" stroke-width="1"/>
  <rect x="2" y="38" width="956" height="286" rx="9" fill="url(#microDots)" opacity="0.55"/>

  <!-- Precision Corner Calibration Marks -->
  <path d="M 14 14 L 24 14 M 14 14 L 14 24" stroke="#52525b" stroke-width="1.2" fill="none"/>
  <path d="M 946 14 L 936 14 M 946 14 L 946 24" stroke="#52525b" stroke-width="1.2" fill="none"/>
  <path d="M 14 312 L 24 312 M 14 312 L 14 302" stroke="#52525b" stroke-width="1.2" fill="none"/>
  <path d="M 946 312 L 936 312 M 946 312 L 946 302" stroke="#52525b" stroke-width="1.2" fill="none"/>

  <!-- Top Telemetry Header Strip -->
  <line x1="1" y1="38" x2="959" y2="38" stroke="#1f1f25" stroke-width="1"/>
  <text x="34" y="24" fill="#a1a1aa" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="1.4">00 // SYSTEM DOSSIER</text>
  <text x="240" y="24" fill="#52525b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">│</text>
  <text x="262" y="24" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="1">NIAT × ADYPU · PUNE, IN</text>

  <!-- Right Live Status Pill -->
  <g transform="translate(692, 11)">
    <rect width="234" height="19" rx="4" fill="#111115" stroke="#27272a" stroke-width="1"/>
    <circle cx="13" cy="9.5" r="3" fill="#10b981" class="led-live"/>
    <text x="24" y="13" fill="#d4d4d8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="0.8">B.TECH CSE (DS) · YEAR 01</text>
  </g>

  <!-- LEFT BLOCK: Identity & Radical Honesty -->
  <text x="34" y="80" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" letter-spacing="2.2">AGIQDEV-ADITYA // PORTFOLIO_SPEC</text>

  <text x="34" y="128" fill="#fafafa" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="-1">ADITYA SHARMA</text>

  <text x="34" y="156" fill="#a1a1aa" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
    1st-year B.Tech CSE — Arch Linux daily driver, hardware &amp; AI builder.
  </text>

  <!-- Dual Mode Split Boxes -->
