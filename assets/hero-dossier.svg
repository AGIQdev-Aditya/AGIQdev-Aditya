    <circle cx="15" cy="17" r="3" fill="#f59e0b"/>
    <text x="26" y="20" fill="#e4e4e7" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="600">GRIND FUNDAMENTALS</text>
    <text x="15" y="37" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">Python &amp; Web from blank files</text>
  </g>

