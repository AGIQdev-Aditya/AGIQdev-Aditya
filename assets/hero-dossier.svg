  <g transform="translate(34, 248)">
    <rect width="488" height="48" rx="6" fill="#0d0d11" stroke="#1e1e24" stroke-width="1"/>
    <text x="16" y="21" fill="#71717a" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="10" letter-spacing="1">VERIFIED GITHUB SNAPSHOT (2026)</text>
    <text x="16" y="38" fill="#d4d4d8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'DejaVu Sans Mono', monospace" font-size="11.5">11 Public Repos   <tspan fill="#3f3f46">│</tspan>   159 Contributions   <tspan fill="#3f3f46">│</tspan>   Joined Feb 2026</text>
  </g>

